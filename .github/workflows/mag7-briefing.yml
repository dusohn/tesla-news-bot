name: MAG7 Daily Briefing (Email + PNG)

on:
  workflow_dispatch:
  schedule:
    # 매일 KST 07:00 = UTC 22:00 (전날)
    - cron: "00 22 * * *"
    # - cron: "30 10 * * *"

permissions:
  contents: read

concurrency:
  group: mag7-daily-briefing
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Korean fonts (Noto CJK)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
          fc-cache -fv
          fc-list | grep -i "noto sans cjk" | head -n 5 || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check email env
        run: |
          echo "OPENAI_API_KEY set: ${{ secrets.OPENAI_API_KEY != '' }}"
          echo "SMTP_USER set: ${{ secrets.SMTP_USER != '' }}"
          echo "SMTP_PASSWORD set: ${{ secrets.SMTP_PASSWORD != '' }}"
          echo "EMAIL_FROM set: ${{ secrets.EMAIL_FROM != '' }}"

      - name: Run bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.5
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: dusohn@gmail.com
        run: |
          python main.py
